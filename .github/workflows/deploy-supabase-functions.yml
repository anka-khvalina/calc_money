name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/fetch-external-odds-17b5
      - main
    paths:
      - supabase/functions/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy userbet-odds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not set. Add it in GitHub → Settings → Secrets."
            exit 1
          fi
          supabase functions deploy userbet-odds --project-ref vhoeiyymxghjafyollyg
