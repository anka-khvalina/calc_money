name: Build Windows EXE

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name FairOddsCalc app/fair_odds_calc.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FairOddsCalc-windows
          path: dist/FairOddsCalc.exe
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FairOddsCalc.exe
          name: FairOddsCalc ${{ github.ref_name }}
          body: |
            Десктоп-калькулятор средней A.

            Скачайте `FairOddsCalc.exe` ниже и запустите двойным кликом (Python не требуется).

            Если Windows покажет SmartScreen ("Windows защитила ваш компьютер"):
            нажмите "Подробнее" -> "Выполнить в любом случае" (файл не подписан сертификатом).
