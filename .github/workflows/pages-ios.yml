name: Deploy iOS web app (GitHub Pages)

on:
  push:
    branches:
      - main
      - cursor/history-store-17b5
      - cursor/shin-match-17b5
      - cursor/team-registry-17b5
      - cursor/team-logos-17b5
      - cursor/build-exe-17b5
      - cursor/supabase-teams-17b5
      - cursor/supabase-history-17b5
    paths:
      - 'web/**'
      - '.github/workflows/pages-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy web/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          destination_dir: .
