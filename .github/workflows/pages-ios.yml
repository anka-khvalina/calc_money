name: Deploy iOS web app (GitHub Pages)

on:
  push:
    branches:
      - main
      - cursor/history-store-17b5
      - cursor/shin-match-17b5
      - cursor/team-registry-17b5
      - cursor/team-logos-17b5
      - cursor/build-exe-17b5
      - cursor/supabase-teams-17b5
      - cursor/supabase-history-17b5
    paths:
      - 'web/**'
      - '.github/workflows/pages-ios.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
